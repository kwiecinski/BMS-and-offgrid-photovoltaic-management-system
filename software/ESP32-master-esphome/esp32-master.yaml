esphome:
  name: photovoltaic-master

packages:
  fire_panel: !include fire-panel.yaml

external_components:
  - source:
      type: local
      path: custom_components

esp32:
  board: esp32doit-devkit-v1
  framework:
    type: arduino

# Enable logging
logger:
  level: INFO

# Enable Home Assistant API
api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  reboot_timeout: 0s
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: !secret fallback_ap_ssid
    password: !secret fallback_ap_password

captive_portal:

time:
  - platform: sntp
    id: sntp_time

sun:
  latitude: 50.0413
  longitude: 21.9990
  id: sun_sun

globals:
  # Indices: battery voltage, PV voltage, operation mode, output priority.
  - id: inverter_read_ms
    type: std::array<uint32_t, 4>
    restore_value: no
    initial_value: '{0, 0, 0, 0}'
  - id: inverter_seen
    type: uint8_t
    restore_value: no
    initial_value: '0'
  - id: inverter_priority_sequence
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: last_mode_change
    type: uint32_t
    restore_value: no
    initial_value: '0'

interval:
  - interval: 1s
    then:
      - lambda: |-
          // Stage 1: voltage-only decisions. All durations use monotonic time.
          constexpr uint32_t MAX_AGE_MS = 30000;
          constexpr uint32_t SOL_STABLE_MS = 120000;
          constexpr uint32_t SOL_COOLDOWN_MS = 15 * 60000;
          constexpr uint32_t CONFIRM_MS = 30000;
          constexpr uint32_t REQUEST_SPACING_MS = 60000;
          const uint32_t now = millis();
          static bool candidate = false;
          static uint32_t candidate_since = 0;
          static int pending = -1;  // -1: none, 0: SUB, 1: SOL
          static uint32_t request_ms = 0;
          static uint32_t request_sequence = 0;
          static bool requested_before = false;
          static int last_requested = -1;
          const auto status = [&](const char *message) {
            if (id(inverter_control_status).state != message) {
              id(inverter_control_status).publish_state(message);
              ESP_LOGI("inverter_control", "%s", message);
            }
          };
          bool fresh[4];
          bool all_fresh = true;
          bool link_recent = false;
          for (size_t index = 0; index < 4; ++index) {
            fresh[index] = (id(inverter_seen) & (1U << index)) &&
                uint32_t(now - id(inverter_read_ms)[index]) <= MAX_AGE_MS;
            all_fresh = all_fresh && fresh[index];
            link_recent = link_recent || fresh[index];
          }
          const auto current = id(output_priority).current_option();
          const bool is_sol = current == "PV-Utility-Battery (SOL)";
          const bool is_sub = current == "PV-Utility-Battery (SUB)";
          const bool valid = all_fresh &&
              std::isfinite(id(battery_average_voltage).state) &&
              id(battery_average_voltage).state > 0.0f &&
              std::isfinite(id(pv_average_voltage).state) &&
              id(pv_average_voltage).state >= 0.0f &&
              id(operation_mode).state != "Unknown";
          int desired = is_sol ? 1 : 0;
          const char *reason = "SUB: voltage conditions not met";
          if (fresh[2] && id(operation_mode).state == "Fault") {
            candidate = false;
            pending = -1;
            status("Inverter fault: automatic writes suspended");
            return;
          } else if (!valid) {
            candidate = false;
            desired = 0;
            reason = "SUB: missing, invalid or stale inverter data";
          } else if (id(pv_average_voltage).state < 180.0f ||
                     (is_sol && id(operation_mode).state == "Mains" &&
                      uint32_t(now - id(inverter_read_ms)[2]) <
                          uint32_t(now - id(last_mode_change)))) {
            // Do not mistake a pre-switch Mains sample for a failed SOL entry.
            candidate = false;
            desired = 0;
            reason = "SUB: low PV voltage or SOL operating on mains";
          } else if (is_sol) {
            candidate = false;
            reason = "SOL: monitoring";
          } else {
            // Astronomy gates entry only. Without valid time, use voltages.
            const bool solar_allowed = !id(sntp_time).now().is_valid() ||
                id(allow_solar_mode).state;
            const bool running = id(operation_mode).state == "Mains" ||
                id(operation_mode).state == "Off-Grid" ||
                id(operation_mode).state == "Bypass";
            const bool good = running && solar_allowed &&
                id(pv_average_voltage).state > 200.0f &&
                id(battery_average_voltage).state >= 26.5f;
            if (!good) {
              candidate = false;
            } else {
              if (!candidate) {
                candidate = true;
                candidate_since = now;
              }
              if (pending == 1) {
                desired = 1;
                reason = "Waiting for SOL priority readback";
              } else if (uint32_t(now - candidate_since) >= SOL_STABLE_MS &&
                  uint32_t(now - id(last_mode_change)) > SOL_COOLDOWN_MS) {
                desired = 1;
                reason = "SOL requested: stable voltages and cooldown complete";
              } else {
                reason = "SUB: waiting for stable voltages or SOL cooldown";
              }
            }
          }
          // A fresh readback, not a write request, confirms the priority.
          if (pending >= 0) {
            if (fresh[3] && id(inverter_priority_sequence) != request_sequence &&
                ((pending == 1 && is_sol) || (pending == 0 && is_sub))) {
              ESP_LOGI("inverter_control", "Priority confirmed: %s", pending == 1 ? "SOL" : "SUB");
              pending = -1;
            } else if (desired == 0 && pending == 1) {
              // A protective SUB request may supersede an unconfirmed SOL write.
              pending = -1;
            } else if (uint32_t(now - request_ms) >= CONFIRM_MS) {
              ESP_LOGW("inverter_control", "Priority %s not confirmed within 30 s", pending == 1 ? "SOL" : "SUB");
              pending = -1;
              candidate = false;
              status("Priority write unconfirmed: waiting before retry");
              return;
            } else {
              status("Waiting for priority readback");
              return;
            }
          }
          if (!link_recent || !(id(inverter_seen) & 8U)) {
            status("No inverter communication: cannot deliver SUB request");
            return;
          }
          // If a SOL write was sent but has not appeared in readback, explicitly
          // supersede it with SUB even while the cached priority still says SUB.
          const bool cancel_sol = desired == 0 && last_requested == 1;
          if (fresh[3] && ((desired == 1 && is_sol) || (desired == 0 && is_sub)) && !cancel_sol) {
            status(reason);
            return;
          }
          if (requested_before && uint32_t(now - request_ms) < REQUEST_SPACING_MS && !cancel_sol) {
            status("Waiting before another priority request");
            return;
          }
          const char *target = desired == 1 ? "PV-Utility-Battery (SOL)" : "PV-Utility-Battery (SUB)";
          auto call = id(output_priority).make_call();
          call.set_option(target);
          call.perform();
          pending = desired;
          last_requested = desired;
          requested_before = true;
          request_ms = now;
          request_sequence = id(inverter_priority_sequence);
          id(last_mode_change) = now;
          candidate = false;
          status(reason);
          ESP_LOGI("inverter_control", "Priority requested: %s", target);

uart:
  - id: easun_uart
    baud_rate: 9600
    tx_pin: GPIO32
    rx_pin: GPIO33

  # Shared Pozyton RS485 bus, 4800 bit/s, 7E1.
  - id: pozyton_uart
    baud_rate: 4800
    data_bits: 7
    parity: EVEN
    stop_bits: 1
    tx_pin: GPIO13
    rx_pin: GPIO14

pozyton_energy_meters:
  id: pozyton_bus
  uart_id: pozyton_uart
  direction_pin: GPIO2
  baud_rate: 4800
  response_timeout: 500ms
  debug_first_response: true
  meters:
    - meter_name: seab
      model: SEAB
      address: "523.0012230"
      update_interval: 10s
      sensors:
        voltage_l1: {name: "SEAB Voltage L1"}
        voltage_l2: {name: "SEAB Voltage L2"}
        voltage_l3: {name: "SEAB Voltage L3"}
        current_l1: {name: "SEAB Current L1"}
        current_l2: {name: "SEAB Current L2"}
        current_l3: {name: "SEAB Current L3"}
        active_power_l1: {name: "SEAB Active Power L1"}
        active_power_l2: {name: "SEAB Active Power L2"}
        active_power_l3: {name: "SEAB Active Power L3"}
        active_power_total: {name: "SEAB Active Power Total"}
        reactive_power_l1: {name: "SEAB Reactive Power L1"}
        reactive_power_l2: {name: "SEAB Reactive Power L2"}
        reactive_power_l3: {name: "SEAB Reactive Power L3"}
        reactive_power_total: {name: "SEAB Reactive Power Total"}
        active_energy_import: {name: "SEAB Active Energy Import"}
        active_energy_export: {name: "SEAB Active Energy Export"}
        reactive_energy_positive: {name: "SEAB Reactive Energy Positive"}
        reactive_energy_negative: {name: "SEAB Reactive Energy Negative"}
        frequency: {name: "SEAB Frequency"}
      diagnostics:
        connection: {name: "SEAB Communication Connected"}
        last_success: {name: "SEAB Last Successful Reading"}
        communication_errors: {name: "SEAB Communication Errors"}

    - meter_name: eabm
      model: EABM
      address: "825 0001275"
      update_interval: 10s
      sensors:
        voltage_l1: {name: "EABM Voltage L1"}
        voltage_l2: {name: "EABM Voltage L2"}
        voltage_l3: {name: "EABM Voltage L3"}
        current_l1: {name: "EABM Current L1"}
        current_l2: {name: "EABM Current L2"}
        current_l3: {name: "EABM Current L3"}
        active_power_l1: {name: "EABM Active Power L1"}
        active_power_l2: {name: "EABM Active Power L2"}
        active_power_l3: {name: "EABM Active Power L3"}
        active_power_total: {name: "EABM Active Power Total"}
        reactive_power_total: {name: "EABM Reactive Power Total"}
        active_energy_import: {name: "EABM Active Energy Import"}
        active_energy_export: {name: "EABM Active Energy Export"}
        reactive_energy_positive: {name: "EABM Reactive Energy Positive"}
        reactive_energy_negative: {name: "EABM Reactive Energy Negative"}
        frequency: {name: "EABM Frequency"}
      diagnostics:
        connection: {name: "EABM Communication Connected"}
        last_success: {name: "EABM Last Successful Reading"}
        communication_errors: {name: "EABM Communication Errors"}


modbus:
  - id: modbus0
    uart_id: easun_uart
    send_wait_time: 200ms

modbus_controller:
  - id: smg0
    address: 0x01
    modbus_id: modbus0
    command_throttle: 200ms
    update_interval: 10s

binary_sensor:
  - platform: template
    name: "Allow Solar Mode"
    id: allow_solar_mode
    lambda: |-
      static bool allow = false;
      static bool evaluated = false;
      static uint32_t evaluated_ms = 0;
      if (!id(sntp_time).now().is_valid()) {
        allow = false;
        evaluated = false;
        return true;
      }
      if (evaluated && uint32_t(millis() - evaluated_ms) < 1000U)
        return allow;
      const double elevation = id(sun_sun).elevation();
      if (!std::isfinite(elevation)) {
        allow = false;
        evaluated = false;
        return true;
      }
      evaluated = true;
      evaluated_ms = millis();
      if (elevation > 15.0)
        allow = true;
      else if (elevation < 8.0)
        allow = false;
      return allow;

  - platform: template
    name: "Inverter Clock Valid"
    entity_category: diagnostic
    lambda: |-
      return id(sntp_time).now().is_valid();


sensor:
  - platform: sun
    name: "Sun Elevation"
    type: elevation
    id: sun_elevation

  - platform: template
    name: "Sun Elevation Angle"
    id: sun_elevation_angle
    unit_of_measurement: "°"
    update_interval: 60s
    accuracy_decimals: 1
    lambda: |-
      return id(sun_elevation).state;


    # Fault code                                                    ULong 100 2 R
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "fault code"
    address: 100
    register_type: holding
    value_type: U_DWORD
    accuracy_decimals: 0

  # Warning code                                                  ULong 108 2 R
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "warning code"
    address: 108
    register_type: holding
    value_type: U_DWORD
    accuracy_decimals: 0

  # Operation Mode                                                UInt  201 1 R 0: Power On
  #                                                                             1: Standby
  #                                                                             2: Mains
  #                                                                             3: Off-Grid
  #                                                                             4: Bypass
  #                                                                             5: Charging
  #                                                                             6: Fault
  #- platform: modbus_controller
  #  modbus_controller_id: smg0
  #  name: "operation mode id"
  #  address: 201
  # register_type: holding
  #  value_type: U_WORD
  #  accuracy_decimals: 0

  # Effective mains voltage                              0.1V     Int   202 1 R
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "ac voltage"
    address: 202
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Mains Frequency                                      0.01Hz   Int   203 1 R
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "ac frequency"
    address: 203
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "Hz"
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  # Average mains power                                  1W       Int   204 1 R
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "average mains power"
    address: 204
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  # Effective inverter voltage                           0.1V     Int   205 1 R
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "effective inverter voltage"
    address: 205
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Effective inverter current                           0.1A     Int   206 1 R
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "effective inverter current"
    address: 206
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Inverter frequency                                   0.01Hz   Int   207 1 R
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "inverter frequency"
    address: 207
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "Hz"
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  # Average inverter power                               1W       Int   208 1 R Positive numbers indicate inverter output, negative numbers indicate inverter input
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "average inverter power"
    address: 208
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  # Inverter charging power                              1W       Int   209 1 R
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "inverter charging power"
    address: 209
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  # Output effective voltage                             0.1V     Int   210 1 R
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "output effective voltage"
    address: 210
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Output effective Current                             0.1A     Int   211 1 R
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "output effective Current"
    address: 211
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Output frequency                                     0.01Hz   Int   212 1 R
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "output frequency"
    address: 212
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "Hz"
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  # Output active power                                  1W       Int   213 1 R
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "output active power"
    address: 213
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    id: output_active_power

  # Output apparent power                                1VA      Int   214 1 R
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "output apparent power"
    address: 214
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "VA"
    device_class: apparent_power
    state_class: measurement
    accuracy_decimals: 0

  # Battery average voltage                                   0.1V     Int   215 1 R
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "battery average voltage"
    address: 215
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    id: battery_average_voltage
    on_value:
      then:
        - lambda: |-
            id(inverter_read_ms)[0] = millis();
            id(inverter_seen) |= 1U;


  # Battery average Current                              0.1A     Int   216 1 R
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "battery average current"
    address: 216
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Battery average power                                1W       Int   217 1 R
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "battery average power"
    address: 217
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  # PV average voltage                                   0.1V     Int   219 1 R
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "pv average voltage"
    address: 219
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    id: pv_average_voltage
    on_value:
      then:
        - lambda: |-
            id(inverter_read_ms)[1] = millis();
            id(inverter_seen) |= 2U;




  # PV average current                                   0.1A     Int   220 1 R
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "pv average current"
    address: 220
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    filters:
